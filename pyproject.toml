[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "mouse-position-heatmap"
version = "0.1.0"
description = "Record global mouse positions and turn them into heatmaps and movement statistics."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pynput>=1.7.7",
]

[project.scripts]
mouse-heatmap = "mouse_heatmap.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["mouse_heatmap"]
